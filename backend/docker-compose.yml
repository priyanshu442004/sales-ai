version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://salesai:salesai_pwd@postgres:5432/salesai_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=super-secret-sales-ai-cryptographic-signing-key-2026
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app

  worker:
    build: .
    command: celery -A app.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://salesai:salesai_pwd@postgres:5432/salesai_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - postgres

  beat:
    build: .
    command: celery -A app.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://salesai:salesai_pwd@postgres:5432/salesai_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - postgres

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=salesai
      - POSTGRES_PASSWORD=salesai_pwd
      - POSTGRES_DB=salesai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
